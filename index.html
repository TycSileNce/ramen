<style>

  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --card: #211d17; --ink: #f2ece2; --muted: #a39a8d; --line: #353026;
            --accent: #ee7a4f; --accent-ink: #1a0f08; --chip: #2b261d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .search { width: 100%; font-size: 20px; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line);
            background: var(--card); color: var(--ink); outline: none; }
  .search:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .chip { border: 0; background: var(--chip); color: var(--ink); padding: 6px 12px; border-radius: 999px;
          font-size: 14px; cursor: pointer; }
  .chip small { color: var(--muted); margin-left: 4px; }
  .chip:hover { outline: 2px solid var(--accent); }
  .hint { color: var(--muted); font-size: 14px; margin: 18px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-top: 14px; }
  .card h2 { font-size: 18px; margin: 0; }
  .basis { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stats { display: flex; gap: 28px; margin: 12px 0 8px; align-items: baseline; flex-wrap: wrap; }
  .big { font-size: 40px; font-weight: 700; color: var(--accent); line-height: 1; }
  .big small { font-size: 16px; color: var(--ink); font-weight: 500; margin-left: 2px; }
  .last { font-size: 18px; font-weight: 600; }
  .last small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .next { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 4px; font-size: 14px; }
  .next code { background: var(--chip); padding: 4px 8px; border-radius: 6px; font-size: 14px; }
  .copy { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 5px 12px;
          font-size: 13px; cursor: pointer; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  ul.recs { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.recs li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
  ul.recs .d { width: 88px; flex: none; font-variant-numeric: tabular-nums; }
  ul.recs .n { width: 44px; flex: none; color: var(--accent); font-weight: 600; }
  ul.recs .t { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  ul.recs a { color: var(--muted); flex: none; }
  .more { color: var(--muted); font-size: 13px; margin-top: 12px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 36px; }
</style>
</head>
<body>
<main>
  <h1>拉麵食記查詢</h1>
  <div class="sub" id="sub"></div>

  <div class="chips" id="chips"></div>
  <div id="out"></div>
  <footer>資料是貼文快照，不會自動連 IG。新增貼文後請重新抓取更新。「舊文」指沒有標訪次的貼文，以發文日當作吃的日期。</footer>
</main>

s":[{"d":"2020/02/07","n":null,"t":"梅子鰻屋","c":"B8RI2vwgWiN","u":true}]}]};

const NORM = s => s.normalize('NFKC').toLowerCase()
  .replace(/雙/g, '双').replace(/臺/g, '台').replace(/麺/g, '麵').replace(/塩/g, '鹽')
  .replace(/ラーメン|らーめん|らぁめん|らぁ麵|らーめん/g, '拉麵')
  .replace(/[\s·・．.\-–—_()（）\[\]【】,，、:：|｜/／&＆]/g, '');

const G = DATA.groups.map(g => ({
  ...g,
  nn: NORM(g.name),
  tt: g.posts.map(p => NORM(p.t)),
}));

const $q = document.getElementById('q');
const $out = document.getElementById('out');
const $chips = document.getElementById('chips');
document.getElementById('sub').textContent =
  `資料更新至 ${DATA.meta.newest}・${DATA.meta.total} 篇貼文・${DATA.meta.shops} 間店（${DATA.meta.since.slice(0,4)} 年起）`;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseD = s => { const [y, m, d] = s.split('/').map(Number); return new Date(y, m - 1, d); };
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const t = new Date(); return `${t.getFullYear()}/${pad(t.getMonth() + 1)}/${pad(t.getDate())}`; };

function ago(dateStr) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const days = Math.round((t - parseD(dateStr)) / 86400000);
  if (days < 0) return '';
  if (days === 0) return '今天';
  if (days < 31) return `${days} 天前`;
  if (days < 365) return `約 ${Math.round(days / 30)} 個月前`;
  const y = Math.floor(days / 365), m = Math.round((days - y * 365) / 30);
  return `約 ${y} 年${m ? ` ${m} 個月` : ''}前`;
}

function bigrams(s) { const r = new Set(); for (let i = 0; i < s.length - 1; i++) r.add(s.slice(i, i + 2)); return r; }
function dice(a, b) {
  if (a.length < 2 || b.length < 2) return 0;
  const A = bigrams(a), B = bigrams(b); let hit = 0;
  A.forEach(x => { if (B.has(x)) hit++; });
  return (2 * hit) / (A.size + B.size);
}

function search(raw) {
  const q = NORM(raw);
  if (!q) return { hits: [], near: [] };
  const hits = [];
  for (const g of G) {
    let rank = null;
    if (g.nn === q) rank = 0;
    else if (g.nn.startsWith(q)) rank = 1;
    else if (g.nn.includes(q)) rank = 2;
    else if (g.tt.some(t => t.includes(q))) rank = 3;
    if (rank !== null) hits.push({ g, rank });
  }
  hits.sort((a, b) => a.rank - b.rank || b.g.count - a.g.count || (a.g.last < b.g.last ? 1 : -1));
  if (hits.length) return { hits: hits.map(h => h.g), near: [] };
  const near = G.map(g => ({ g, s: Math.max(dice(q, g.nn), ...g.tt.map(t => dice(q, t))) }))
    .filter(x => x.s >= 0.34).sort((a, b) => b.s - a.s).slice(0, 5).map(x => x.g);
  return { hits: [], near };
}

function card(g) {
  const next = g.count + 1;
  const title = `${todayStr()} ${g.title} ${next}訪`;
  const basis = g.basis === 'tag'
    ? (g.extra ? `依貼文標示（最後標示 ${g.latestTag} 訪，之後另有 ${g.extra} 篇未標示，已加上）` : '依貼文標示的訪次')
    : '舊文沒標訪次，依貼文篇數推算';
  const recs = g.posts.map(p => `
    <li><span class="d">${p.d}${p.u ? '' : ''}</span><span class="n">${p.n != null ? p.n + '訪' : '—'}</span>
    <span class="t">${esc(p.t)}</span><a href="https://www.instagram.com/p/${p.c}/" target="_blank" rel="noopener">貼文</a></li>`).join('');
  return `
  <div class="card">
    <h2>${esc(g.name)}</h2>
    <div class="basis">${basis}</div>
    <div class="stats">
      <div class="big">${g.count}<small>訪</small></div>
      <div class="last"><span class="label">上次</span>${g.last}<small>${ago(g.last)}</small></div>
    </div>
    <div class="next"><span>下次貼文標題</span><code>${esc(title)}</code>
      <button class="copy" data-t="${esc(title)}">複製</button></div>
    <details><summary>全部紀錄（${g.posts.length} 篇）</summary><ul class="recs">${recs}</ul></details>
  </div>`;
}

function render() {
  const raw = $q.value.trim();
  if (!raw) { $out.innerHTML = '<div class="hint">輸入店名後會顯示吃過幾次、上次是哪天。可以只打一部分，繁簡、新舊字體與「拉麵／ラーメン」寫法都能互通。</div>'; return; }
  const { hits, near } = search(raw);
  if (!hits.length) {
    $out.innerHTML = near.length
      ? `<div class="hint">沒有完全符合的店，你是不是要找：</div><div class="chips">${near.map(g => `<button class="chip" data-q="${esc(g.name)}">${esc(g.name)}</button>`).join('')}</div>`
      : '<div class="hint">找不到這間店。可能是還沒吃過（會是第 1 訪），或是店名寫法差很多，換個關鍵字試試。</div>';
    return;
  }
  const shown = hits.slice(0, 8);
  $out.innerHTML = shown.map(card).join('') +
    (hits.length > shown.length ? `<div class="more">還有 ${hits.length - shown.length} 間符合，請輸入更完整的店名縮小範圍。</div>` : '');
}

$q.addEventListener('input', render);
document.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (c && c.dataset.q != null) { $q.value = c.dataset.q; render(); $q.focus(); }
  const b = e.target.closest('.copy');
  if (b) {
    const done = () => { const o = b.textContent; b.textContent = '已複製'; setTimeout(() => b.textContent = o, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.t).then(done, done);
    else { const ta = document.createElement('textarea'); ta.value = b.dataset.t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); done(); }
  }
});

$chips.innerHTML = [...G].sort((a, b) => b.count - a.count).slice(0, 12)
  .map(g => `<button class="chip" data-q="${esc(g.name)}">${esc(g.name)}<small>${g.count}</small></button>`).join('');
render();
</script>
